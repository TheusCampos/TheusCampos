<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="treeGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="treeGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="treeGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="380" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="600" cy="180" r="90" fill="#fde047" opacity="0.9"/>
  <circle cx="600" cy="180" r="120" fill="#fef08a" opacity="0.4"/>

  <!-- Distant Mountains -->
  <path d="M 0 380 L 0 250 L 150 150 L 300 250 L 450 180 L 700 320 L 900 160 L 1100 260 L 1200 200 L 1200 380 Z" fill="#fb923c" opacity="0.6"/>
  <path d="M 0 380 L 0 280 L 200 180 L 400 280 L 600 200 L 850 300 L 1050 200 L 1200 280 L 1200 380 Z" fill="#f97316" opacity="0.5"/>

  <!-- Base Ground -->
  <rect x="0" y="280" width="1200" height="100" fill="#064e3b"/>

  <!-- Background Trees -->
  <g fill="url(#treeGradBack)">
    <path d="M 50 300 L 100 150 L 150 300 Z"/>
    <path d="M -20 320 L 60 100 L 140 320 Z"/>
    <path d="M 120 310 L 180 180 L 240 310 Z"/>
    <path d="M 180 320 L 250 120 L 320 320 Z"/>
    <path d="M 280 310 L 340 160 L 400 310 Z"/>
    
    <path d="M 800 310 L 860 160 L 920 310 Z"/>
    <path d="M 880 320 L 950 120 L 1020 320 Z"/>
    <path d="M 960 310 L 1020 180 L 1080 310 Z"/>
    <path d="M 1060 320 L 1140 100 L 1220 320 Z"/>
    <path d="M 1100 300 L 1150 150 L 1200 300 Z"/>
  </g>

  <!-- Midground Trees -->
  <g fill="url(#treeGradMid)">
    <path d="M -50 380 L 80 50 L 210 380 Z"/>
    <path d="M 100 380 L 220 100 L 340 380 Z"/>
    <path d="M 250 380 L 360 80 L 470 380 Z"/>

    <path d="M 730 380 L 840 80 L 950 380 Z"/>
    <path d="M 860 380 L 980 100 L 1100 380 Z"/>
    <path d="M 990 380 L 1120 50 L 1250 380 Z"/>
  </g>

  <!-- The Dirt Path -->
  <path d="M 600 220 Q 550 300 350 380 L 850 380 Q 650 300 600 220 Z" fill="url(#pathGrad)"/>
  
  <!-- Path Details (Stones/Texture) -->
  <ellipse cx="600" cy="300" rx="15" ry="5" fill="#a16207" opacity="0.6"/>
  <ellipse cx="560" cy="340" rx="25" ry="8" fill="#a16207" opacity="0.6"/>
  <ellipse cx="650" cy="360" rx="20" ry="7" fill="#a16207" opacity="0.6"/>
  <ellipse cx="620" cy="270" rx="10" ry="4" fill="#a16207" opacity="0.6"/>

  <!-- Foreground Trees -->
  <g fill="url(#treeGradFront)">
    <path d="M -100 450 L 100 -50 L 300 450 Z"/>
    <path d="M -150 450 L 0 -20 L 150 450 Z"/>
    
    <path d="M 900 450 L 1100 -50 L 1300 450 Z"/>
    <path d="M 1050 450 L 1200 -20 L 1350 450 Z"/>
  </g>

  <!-- The Hero Character Silhouette -->
  <!-- Standing at the beginning of the path, looking towards the sun/adventure -->
  <g fill="#1c1917">
    <!-- Body -->
    <rect x="585" y="300" width="30" height="45" rx="8"/>
    <!-- Head -->
    <circle cx="600" cy="280" r="16"/>
    <!-- Backpack -->
    <rect x="572" y="305" width="20" height="30" rx="6"/>
    <!-- Staff / Sword on back -->
    <line x1="565" y1="260" x2="615" y2="340" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
    <circle cx="565" cy="260" r="6" fill="#1c1917"/>
    <!-- Legs -->
    <rect x="590" y="340" width="8" height="25" rx="4"/>
    <rect x="602" y="340" width="8" height="25" rx="4"/>
    <!-- Arms -->
    <rect x="610" y="305" width="8" height="25" rx="4" transform="rotate(-15 610 305)"/>
  </g>

  <!-- Birds in the sky -->
  <g stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M 350 120 Q 365 100 380 120 Q 395 100 410 120"/>
    <path d="M 430 90 Q 440 75 450 90 Q 460 75 470 90"/>
    <path d="M 800 130 Q 815 110 830 130 Q 845 110 860 130"/>
    <path d="M 880 100 Q 890 85 900 100 Q 910 85 920 100"/>
  </g>

  <!-- Text -->
  <text x="600" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="6">
    MATHEUS CAMPOS
  </text>
  <text x="600" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#92400e" text-anchor="middle" letter-spacing="4">
    O INÍCIO DA JORNADA
  </text>

  <!-- Clipping mask to round the whole SVG if needed, but rx="16" on rects handles it well -->
  <rect x="0" y="0" width="1200" height="380" rx="16" fill="none" stroke="#ca8a04" stroke-width="4" opacity="0.5"/>
</svg>
