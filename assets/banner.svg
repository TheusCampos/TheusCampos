<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0f294a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#071426" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanCore" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="85%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#cyanCore)"/>
  <rect width="1200" height="380" rx="16" fill="url(#leftGlow)"/>
  <rect width="1200" height="380" rx="16" fill="url(#rightGlow)"/>

  <!-- Border with futuristic glow -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Cyber Grid (Perspective Lines) -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="0.8">
    <!-- Horizontal lines -->
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="335" x2="1200" y2="335"/>
    <line x1="0" y1="355" x2="1200" y2="355"/>
    <line x1="0" y1="370" x2="1200" y2="370"/>

    <!-- Perspective vanishing lines to center horizon (600, 240) -->
    <line x1="0" y1="380" x2="600" y2="240"/>
    <line x1="120" y1="380" x2="600" y2="240"/>
    <line x1="240" y1="380" x2="600" y2="240"/>
    <line x1="360" y1="380" x2="600" y2="240"/>
    <line x1="480" y1="380" x2="600" y2="240"/>
    <line x1="600" y1="380" x2="600" y2="240"/>
    <line x1="720" y1="380" x2="600" y2="240"/>
    <line x1="840" y1="380" x2="600" y2="240"/>
    <line x1="960" y1="380" x2="600" y2="240"/>
    <line x1="1080" y1="380" x2="600" y2="240"/>
    <line x1="1200" y1="380" x2="600" y2="240"/>
  </g>

  <!-- Futuristic Corner Markers -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.8">
    <!-- Top Left -->
    <path d="M 25 45 L 25 25 L 45 25" fill="none"/>
    <!-- Top Right -->
    <path d="M 1155 25 L 1175 25 L 1175 45" fill="none"/>
    <!-- Bottom Left -->
    <path d="M 25 335 L 25 355 L 45 355" fill="none"/>
    <!-- Bottom Right -->
    <path d="M 1155 355 L 1175 355 L 1175 335" fill="none"/>
  </g>

  <!-- High-Tech Status Header -->
  <g opacity="0.75">
    <circle cx="55" cy="45" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="68" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="3">SYSTEM STATUS: ONLINE</text>
    <text x="1145" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="3" text-anchor="end">LOC: CUIABÁ - BR [15.6014° S, 56.0979° W]</text>
  </g>

  <!-- Center Accent Glowing Divider -->
  <line x1="200" y1="85" x2="1000" y2="85" stroke="url(#cyanLine)" stroke-width="1.5" filter="url(#subtleGlow)"/>

  <!-- Main Name Typography -->
  <g filter="url(#neonGlow)">
    <text x="600" y="175" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">
      MATHEUS CAMPOS
    </text>
  </g>
  <text x="600" y="175" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">
    MATHEUS CAMPOS
  </text>

  <!-- Role Subtitle with Tech Brackets -->
  <g opacity="0.9">
    <text x="600" y="222" font-family="'Fira Code', monospace, sans-serif" font-size="18" font-weight="500" fill="#67e8f9" text-anchor="middle" letter-spacing="6">
      &lt; FRONT-END ARCHITECT &amp; UI DEVELOPER /&gt;
    </text>
  </g>

  <!-- Tech Badges / Pills in futuristic container -->
  <g transform="translate(600, 275)">
    <!-- Pill Container -->
    <rect x="-340" y="-18" width="680" height="36" rx="18" fill="url(#tagBg)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="5" font-family="'Fira Code', monospace, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="middle" letter-spacing="2">
      REACT  •  NEXT.JS  •  TYPESCRIPT  •  TAILWIND CSS  •  AI INTEGRATIONS
    </text>
  </g>

  <!-- Floating Digital Code Particles -->
  <g opacity="0.35" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">
    <text x="90" y="125">const passion = "clean_code";</text>
    <text x="80" y="150">&gt; state: optimized</text>
    <text x="100" y="210">build(experience);</text>
    
    <text x="960" y="125">while (coding) {</text>
    <text x="980" y="150">innovate();</text>
    <text x="960" y="175">}</text>
    <text x="970" y="220">return &lt;Excellence /&gt;;</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="350" y1="330" x2="850" y2="330" stroke="url(#cyanLine)" stroke-width="1" opacity="0.7"/>
</svg>
